# Creates a cohesive introductory Torus course, a synthetic cohort, and realistic progress.
# This is a one-time initializer for a fresh or deliberately reset development/preview database.

- institution:
    name: "OLI Torus Demo Institution"
    country_code: "US"
    institution_email: "oli-torus-demo@scenarios.invalid"
    institution_url: "https://scenarios.invalid/oli-torus-demo"

- ownership:
    # Requires an active system administrator from baseline priv/repo/seeds.exs.
    # Fresh non-dev previews must supply ADMIN_EMAIL and ADMIN_PASSWORD in the runtime Secret.
    # See docs/manifests/preview-seeding/README.md for the bootstrap prerequisite.
    author: default_admin
    institution: "ref:OLI Torus Demo Institution"

- project:
    name: "oli_torus_getting_started_course"
    title: "Getting Started with OLI Torus"
    objectives:
      - Author effective course content:
          - "Organize projects into units and pages"
          - "Align activities with learning objectives"
      - Publish course materials:
          - "Distinguish projects, publications, and sections"
          - "Sequence the authoring-to-delivery workflow"
    root:
      children:
        - container: "Authoring with Torus"
          children:
            - page: "Welcome to OLI Torus"
            - page: "Organize Your Course"
            - page: "Design Activities for Learning"
        - container: "Publishing and Delivery"
          children:
            - page: "Publish and Deliver Your Course"
            - page: "Getting Started Assessment"

- create_activity:
    project: "oli_torus_getting_started_course"
    title: "The Torus Authoring Workspace"
    virtual_id: "torus_workspace_mcq"
    type: "oli_multiple_choice"
    objectives:
      - "Distinguish projects, publications, and sections"
    content_format: "json"
    content:
      activityType: "oli_multiple_choice"
      stem:
        id: "workspace_mcq_stem"
        content:
          - type: "p"
            children:
              - text: "Which Torus object is the editable workspace where authors organize and revise course content?"
      choices:
        - id: "project"
          content:
            - type: "p"
              children:
                - text: "A project"
        - id: "publication"
          content:
            - type: "p"
              children:
                - text: "A publication"
        - id: "section"
          content:
            - type: "p"
              children:
                - text: "A section"
      authoring:
        version: 2
        targeted: []
        transformations: []
        previewText: ""
        parts:
          - id: "1"
            scoringStrategy: "best"
            responses:
              - id: "workspace_mcq_correct"
                rule: "input like {project}"
                score: 1
                correct: true
                feedback:
                  id: "workspace_mcq_correct_feedback"
                  content:
                    - type: "p"
                      children:
                        - text: "Correct. A project is the editable authoring workspace."
              - id: "workspace_mcq_incorrect"
                rule: "input like {.*}"
                score: 0
                correct: false
                feedback:
                  id: "workspace_mcq_incorrect_feedback"
                  content:
                    - type: "p"
                      children:
                        - text: "Publications are stable snapshots and sections deliver them; authors edit projects."
            hints:
              - id: "getting_started_orientation_hint"
                content:
                  - type: "p"
                    children:
                      - text: "Look for the object where authors arrange and revise content."
                editor: "slate"
                textDirection: "ltr"
              - id: "getting_started_reasoning_hint"
                content:
                  - type: "p"
                    children:
                      - text: "Separate the editable source from its stable snapshot and learner delivery instance."
                editor: "slate"
                textDirection: "ltr"
              - id: "getting_started_bottom_out_hint"
                content:
                  - type: "p"
                    children:
                      - text: "The editable authoring workspace is the project."
                editor: "slate"
                textDirection: "ltr"

- create_activity:
    project: "oli_torus_getting_started_course"
    title: "Build a Course Structure"
    virtual_id: "course_structure_ordering"
    type: "oli_ordering"
    objectives:
      - "Organize projects into units and pages"
    content_format: "json"
    content:
      activityType: "oli_ordering"
      stem:
        id: "course_structure_ordering_stem"
        content:
          - type: "p"
            children:
              - text: "Put these course-organization steps in a sensible order."
      choices:
        - id: "create_project"
          content:
            - type: "p"
              children:
                - text: "Create the project workspace"
        - id: "add_unit"
          content:
            - type: "p"
              children:
                - text: "Add a unit or module"
        - id: "add_pages"
          content:
            - type: "p"
              children:
                - text: "Add lesson and practice pages"
        - id: "review_sequence"
          content:
            - type: "p"
              children:
                - text: "Review the learner sequence"
      authoring:
        version: 2
        targeted: []
        transformations: []
        previewText: ""
        correct:
          - ["create_project", "add_unit", "add_pages", "review_sequence"]
          - "course_structure_ordering_correct"
        parts:
          - id: "1"
            scoringStrategy: "best"
            responses:
              - id: "course_structure_ordering_correct"
                rule: "input like {create_project add_unit add_pages review_sequence}"
                score: 1
                correct: true
                feedback:
                  id: "course_structure_ordering_correct_feedback"
                  content:
                    - type: "p"
                      children:
                        - text: "Correct. Build from the workspace to units and pages, then review the learner path."
              - id: "course_structure_ordering_incorrect"
                rule: "input like {.*}"
                score: 0
                correct: false
                feedback:
                  id: "course_structure_ordering_incorrect_feedback"
                  content:
                    - type: "p"
                      children:
                        - text: "Create the workspace before adding its structure, and review the sequence last."
            hints:
              - id: "course_structure_orientation_hint"
                content:
                  - type: "p"
                    children:
                      - text: "Start with the authoring workspace and finish by checking the learner path."
                editor: "slate"
                textDirection: "ltr"
              - id: "course_structure_reasoning_hint"
                content:
                  - type: "p"
                    children:
                      - text: "The project must exist before you add its unit and pages."
                editor: "slate"
                textDirection: "ltr"
              - id: "course_structure_bottom_out_hint"
                content:
                  - type: "p"
                    children:
                      - text: "Create the project, add a unit, add pages, and then review the sequence."
                editor: "slate"
                textDirection: "ltr"

- create_activity:
    project: "oli_torus_getting_started_course"
    title: "Choose Aligned Authoring Practices"
    virtual_id: "aligned_activity_cata"
    type: "oli_check_all_that_apply"
    objectives:
      - "Align activities with learning objectives"
    content_format: "json"
