- edit_page:
    project: "oli_torus_getting_started_course"
    page: "Welcome to OLI Torus"
    objectives:
      - "Distinguish projects, publications, and sections"
    content: |
      title: "Welcome to OLI Torus"
      graded: false
      blocks:
        - type: prose
          body_md: |
            # Welcome to OLI Torus

            OLI Torus helps teams author, publish, and deliver evidence-centered learning
            experiences. This short course follows content from its editable source to the
            learner-facing course.

            ## Three objects to know

            - A **project** is the editable authoring workspace.
            - A **publication** is a stable snapshot of project content.
            - A **section** delivers a publication to enrolled learners.

            Authors can continue improving a project without silently changing the stable
            experience learners are already using.
        - type: activity_reference
          virtual_id: "torus_workspace_mcq"

- edit_page:
    project: "oli_torus_getting_started_course"
    page: "Organize Your Course"
    objectives:
      - "Organize projects into units and pages"
    content: |
      title: "Organize Your Course"
      graded: false
      blocks:
        - type: prose
          body_md: |
            # Organize Your Course

            A useful curriculum makes its structure visible. **Containers** group related
            material into units or modules. **Pages** hold explanations, examples, media, and
            activities.

            Use clear titles and a deliberate order. Before publishing, read the curriculum like
            a learner: check where each idea begins, where practice appears, and what comes next.
        - type: activity_reference
          virtual_id: "course_structure_ordering"

- edit_page:
    project: "oli_torus_getting_started_course"
    page: "Design Activities for Learning"
    objectives:
      - "Align activities with learning objectives"
    content: |
      title: "Design Activities for Learning"
      graded: false
      blocks:
        - type: prose
          body_md: |
            # Design Activities for Learning

            Start with an observable learning objective, then attach activities that provide
            evidence for it. Low-stakes practice gives learners room to try, request a hint,
            review feedback, reset, and improve.

            Helpful feedback explains why a response works or what to reconsider. Preview both
            correct and incorrect paths so every response supports the intended learning goal.
        - type: activity_reference
          virtual_id: "aligned_activity_cata"

- edit_page:
    project: "oli_torus_getting_started_course"
    page: "Publish and Deliver Your Course"
    objectives:
      - "Distinguish projects, publications, and sections"
      - "Sequence the authoring-to-delivery workflow"
    content: |
      title: "Publish and Deliver Your Course"
      graded: false
      blocks:
        - type: prose
          body_md: |
            # Publish and Deliver Your Course

            Preview and review the project before publishing. Publishing creates the stable
            snapshot that can be delivered to learners.

            Create a section from that publication and enroll learners in the section. Later
            authoring changes stay in the project until a new publication is created and the
            section is intentionally updated.
        - type: activity_reference
          virtual_id: "publication_term_short_answer"
        - type: activity_reference
          virtual_id: "delivery_objects_multi_input"

- edit_page:
    project: "oli_torus_getting_started_course"
    page: "Getting Started Assessment"
    objectives:
      - "Organize projects into units and pages"
      - "Align activities with learning objectives"
      - "Distinguish projects, publications, and sections"
      - "Sequence the authoring-to-delivery workflow"
    content: |
      title: "Getting Started Assessment"
      graded: true
      blocks:
        - type: prose
          body_md: |
            # Getting Started Assessment

            Demonstrate your understanding of course structure, activity alignment, publication,
            and delivery. Your responses are scored by the same Torus evaluators used in normal
            learner delivery.
        - type: activity_reference
          virtual_id: "torus_workspace_mcq"
        - type: activity_reference
          virtual_id: "course_structure_ordering"
        - type: activity_reference
          virtual_id: "aligned_activity_cata"
        - type: activity_reference
          virtual_id: "publication_term_short_answer"
        - type: activity_reference
          virtual_id: "delivery_objects_multi_input"

