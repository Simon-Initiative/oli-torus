      activityType: "oli_check_all_that_apply"
      stem:
        id: "aligned_activity_cata_stem"
        content:
          - type: "p"
            children:
              - text: "Which authoring choices support an aligned learning experience? Select all that apply."
      choices:
        - id: "attach_objectives"
          content:
            - type: "p"
              children:
                - text: "Attach activities to the objectives they assess"
        - id: "use_feedback"
          content:
            - type: "p"
              children:
                - text: "Provide useful hints and explanatory feedback"
        - id: "decorate_only"
          content:
            - type: "p"
              children:
                - text: "Add decorative content without checking the learning goal"
      authoring:
        version: 2
        targeted: []
        transformations: []
        previewText: ""
        correct:
          - ["attach_objectives", "use_feedback"]
          - "aligned_activity_cata_correct"
        parts:
          - id: "1"
            scoringStrategy: "best"
            responses:
              - id: "aligned_activity_cata_correct"
                rule: "input like {attach_objectives use_feedback}"
                score: 1
                correct: true
                feedback:
                  id: "aligned_activity_cata_correct_feedback"
                  content:
                    - type: "p"
                      children:
                        - text: "Correct. Alignment provides evidence, and actionable support helps learners improve."
              - id: "aligned_activity_cata_incorrect"
                rule: "input like {.*}"
                score: 0
                correct: false
                feedback:
                  id: "aligned_activity_cata_incorrect_feedback"
                  content:
                    - type: "p"
                      children:
                        - text: "Choose practices that connect evidence and learner support to the intended objective."
            hints:
              - id: "aligned_activity_orientation_hint"
                content:
                  - type: "p"
                    children:
                      - text: "Choose practices that connect evidence and learner support to the intended outcome."
                editor: "slate"
                textDirection: "ltr"
              - id: "aligned_activity_reasoning_hint"
                content:
                  - type: "p"
                    children:
                      - text: "Look for both objective alignment and guidance that helps a learner improve."
                editor: "slate"
                textDirection: "ltr"
              - id: "aligned_activity_bottom_out_hint"
                content:
                  - type: "p"
                    children:
                      - text: "Select attaching activities to objectives and providing useful hints and feedback."
                editor: "slate"
                textDirection: "ltr"

