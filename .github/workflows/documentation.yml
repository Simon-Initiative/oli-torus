name: Documentation
on:
  push:
    branches:
      - master
  # manually trigger a documentation build from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    # Temporarily allow manual branch builds to validate the Pages artifact before merging.
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: assets/yarn.lock

      - name: 🔧 Configure
        run: cp oli.example.env oli.env

      - name: 🧪 Setup BEAM toolchain
        uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.19.2 # Define the elixir version [required]
          otp-version: 28.1.1 # Define the OTP version [required]
          gleam-version: "1.16.0"

      - name: ⬇️ Install Gleam Mix archive
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix archive.install hex mix_gleam 0.6.2 --force

      - name: ⬇️ Install Elixir Dependencies
        run: mix deps.get

      - name: 🔨 Build Gleam project
        run: gleam build --target erlang
        working-directory: gleam

      - name: 🔨📦 Build Dependencies
        run: mix deps.compile

      - name: Install node_module dependencies 📦
        run: npm install -g yarn && yarn --cwd assets

      - name: Build client-side API markdown docs
        run: yarn --cwd assets run sdk-docs

      - name: 🔨📄 Build Docs
        run: mix docs

      - name: 🔨📖 Build client-side storybook docs
        run: yarn --cwd assets run storybook:build

      - name: 📦 Upload Docs
        uses: actions/upload-pages-artifact@v4
        with:
          path: doc/

  deploy:
    needs: docs
    # Temporarily allow an end-to-end deployment test from the MER-6055 subtask branch.
    if: >-
      github.ref == 'refs/heads/master' ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/sub-task/MER-6055-implement-native-git-hub-pages-deployment-in-the-documentation-workflow')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy Docs
        id: deployment
        uses: actions/deploy-pages@v4
