name: "Validate Master Branch Source"

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  check-branch-name:
    name: Validate master source branch
    # Stack workflows trigger against the trunk; enforce this rule only for
    # pull requests whose immediate base is master.
    if: github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Validate source branch name
        id: validate-branch
        env:
          BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          shopt -s nocasematch

          case "$BRANCH" in
            integ-*|story/*|bug/*|task/*)
              echo "integration=true" >> "$GITHUB_OUTPUT"
              ;;
            dependabot/*)
              echo "integration=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              printf "::error::Branch '%s' must match integ-*, story/*, bug/*, task/*, or dependabot/* (case-insensitive) to merge into master.\n" "$BRANCH"
              exit 1
              ;;
          esac

          printf "Branch '%s' is allowed to merge into master.\n" "$BRANCH"

      - name: Label integration pull request
        if: steps.validate-branch.outputs.integration == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.issue.number,
              labels: ['Integration Branch'],
            });
