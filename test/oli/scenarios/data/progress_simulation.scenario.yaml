# Scenario: Bulk-enroll learners and simulate progress across practice and graded pages.
# The graded assessment exercises every native activity type supported by simulation.

- institution:
    name: "Progress Simulation Institution"
    country_code: "US"
    institution_email: "progress-simulation@scenarios.invalid"
    institution_url: "https://scenarios.invalid/progress-simulation"

- ownership:
    author: default_admin
    institution: "ref:Progress Simulation Institution"

- project:
    name: "progress_simulation"
    title: "Progress Simulation"
    root:
      children:
        - page: "Practice Introduction"
        - page: "Native Activity Practice"
        - page: "Native Activity Assessment"

- create_activity:
    project: "progress_simulation"
    title: "Multiple Choice Question"
    virtual_id: "progress_mcq"
    type: "oli_multiple_choice"
    content_format: "json"
    content:
      activityType: "oli_multiple_choice"
      stem:
        id: "mcq_stem"
        content:
          - type: "p"
            children:
              - text: "Choose the correct option."
      choices:
        - id: "a"
          content:
            - type: "p"
              children:
                - text: "Incorrect"
        - id: "b"
          content:
            - type: "p"
              children:
                - text: "Correct"
      authoring:
        version: 2
        targeted: []
        transformations: []
        previewText: ""
        parts:
          - id: "1"
            scoringStrategy: "best"
            responses:
              - id: "mcq_correct"
                rule: "input like {b}"
                score: 1
                correct: true
                feedback:
                  id: "mcq_correct_feedback"
                  content: []
              - id: "mcq_incorrect"
                rule: "input like {.*}"
                score: 0
                correct: false
                feedback:
                  id: "mcq_incorrect_feedback"
                  content: []
            hints: &default_hints
              - id: "deer_in_headlights_hint"
                content: []
                editor: "slate"
                textDirection: "ltr"
              - id: "cognitive_hint"
                content: []
                editor: "slate"
                textDirection: "ltr"
              - id: "bottom_out_hint"
                content: []
                editor: "slate"
                textDirection: "ltr"

- create_activity:
    project: "progress_simulation"
    title: "Ordering Question"
    virtual_id: "progress_ordering"
    type: "oli_ordering"
    content_format: "json"
    content:
      activityType: "oli_ordering"
      stem:
        id: "ordering_stem"
        content:
          - type: "p"
            children:
              - text: "Put the steps in order."
      choices:
        - id: "first"
          content:
            - type: "p"
              children:
                - text: "First"
        - id: "second"
          content:
            - type: "p"
              children:
                - text: "Second"
        - id: "third"
          content:
            - type: "p"
              children:
                - text: "Third"
      authoring:
        version: 2
        targeted: []
        transformations: []
        previewText: ""
        correct:
          - ["first", "second", "third"]
          - "ordering_correct"
        parts:
          - id: "1"
            scoringStrategy: "best"
            responses:
              - id: "ordering_correct"
                rule: "input like {first second third}"
                score: 1
                correct: true
                feedback:
                  id: "ordering_correct_feedback"
                  content: []
              - id: "ordering_incorrect"
                rule: "input like {.*}"
                score: 0
                correct: false
                feedback:
                  id: "ordering_incorrect_feedback"
                  content: []
            hints: *default_hints

- create_activity:
    project: "progress_simulation"
    title: "Check All That Apply Question"
    virtual_id: "progress_cata"
    type: "oli_check_all_that_apply"
    content_format: "json"
    content:
      activityType: "oli_check_all_that_apply"
      stem:
        id: "cata_stem"
        content:
          - type: "p"
            children:
              - text: "Select both correct options."
      choices:
        - id: "c1"
          content:
            - type: "p"
              children:
                - text: "Correct one"
        - id: "c2"
          content:
            - type: "p"
              children:
                - text: "Correct two"
        - id: "c3"
          content:
            - type: "p"
              children:
                - text: "Incorrect"
      authoring:
        version: 2
        targeted: []
        transformations: []
        previewText: ""
        correct:
          - ["c1", "c2"]
          - "cata_correct"
        parts:
          - id: "1"
            scoringStrategy: "best"
            responses:
              - id: "cata_correct"
                rule: "input like {c1 c2}"
                score: 1
                correct: true
                feedback:
                  id: "cata_correct_feedback"
                  content: []
              - id: "cata_incorrect"
                rule: "input like {.*}"
                score: 0
                correct: false
                feedback:
                  id: "cata_incorrect_feedback"
                  content: []
            hints: *default_hints

- create_activity:
    project: "progress_simulation"
    title: "Single Response Question"
    virtual_id: "progress_single_response"
    type: "oli_short_answer"
    content_format: "json"
    content:
      activityType: "oli_short_answer"
      stem:
        id: "single_response_stem"
        content:
          - type: "p"
            children:
              - text: "Enter the expected answer."
      inputType: "text"
      authoring:
        targeted: []
        transformations: []
        previewText: ""
        parts:
          - id: "1"
            scoringStrategy: "best"
            responses:
              - id: "single_response_correct"
                rule: "input contains {scenario}"
                score: 1
                correct: true
                feedback:
                  id: "single_response_correct_feedback"
                  content: []
              - id: "single_response_incorrect"
                rule: "input like {.*}"
                score: 0
                correct: false
                feedback:
                  id: "single_response_incorrect_feedback"
                  content: []
            hints: *default_hints

- create_activity:
    project: "progress_simulation"
    title: "Multi Input Question"
    virtual_id: "progress_multi_input"
    type: "oli_multi_input"
    content_format: "json"
    content:
      activityType: "oli_multi_input"
      submitPerPart: false
      choices: []
      inputs:
        - id: "text_input"
          inputType: "text"
          partId: "text_part"
        - id: "numeric_input"
          inputType: "numeric"
          partId: "numeric_part"
      stem:
        id: "multi_input_stem"
        content:
          - type: "p"
            children:
              - text: "Complete both inputs: "
              - type: "input_ref"
                id: "text_input"
                children:
                  - text: ""
              - text: " and "
              - type: "input_ref"
                id: "numeric_input"
                children:
                  - text: ""
      authoring:
        targeted: []
        transformations: []
        previewText: ""
        parts:
          - id: "text_part"
            scoringStrategy: "best"
            gradingApproach: "automatic"
            responses:
              - id: "multi_input_text_correct"
                rule: "input contains {answer}"
                score: 1
                correct: true
                feedback:
                  id: "multi_input_text_correct_feedback"
                  content: []
              - id: "multi_input_text_incorrect"
                rule: "input like {.*}"
                score: 0
                correct: false
                feedback:
                  id: "multi_input_text_incorrect_feedback"
                  content: []
            hints: *default_hints
          - id: "numeric_part"
            scoringStrategy: "best"
            gradingApproach: "automatic"
            responses:
              - id: "multi_input_numeric_correct"
                rule: "input = {1}"
                score: 1
                correct: true
                feedback:
                  id: "multi_input_numeric_correct_feedback"
                  content: []
              - id: "multi_input_numeric_incorrect"
                rule: "input like {.*}"
                score: 0
                correct: false
                feedback:
                  id: "multi_input_numeric_incorrect_feedback"
                  content: []
            hints: *default_hints

- edit_page:
    project: "progress_simulation"
    page: "Practice Introduction"
    content: |
      title: "Practice Introduction"
      graded: false
      blocks:
        - type: prose
          body_md: "Review this introduction before starting the assessment."

- edit_page:
    project: "progress_simulation"
    page: "Native Activity Practice"
    content: |
      title: "Native Activity Practice"
      graded: false
      blocks:
        - type: prose
          body_md: "Try these unscored activities before starting the assessment."
        - type: activity_reference
          virtual_id: "progress_mcq"
        - type: activity_reference
          virtual_id: "progress_ordering"
        - type: activity_reference
          virtual_id: "progress_single_response"

- edit_page:
    project: "progress_simulation"
    page: "Native Activity Assessment"
    content: |
      title: "Native Activity Assessment"
      graded: true
      blocks:
        - type: activity_reference
          virtual_id: "progress_mcq"
        - type: activity_reference
          virtual_id: "progress_ordering"
        - type: activity_reference
          virtual_id: "progress_cata"
        - type: activity_reference
          virtual_id: "progress_single_response"
        - type: activity_reference
          virtual_id: "progress_multi_input"

- publish:
    to: "progress_simulation"
    description: "Publish practice and graded progress simulation pages"

- section:
    name: "progress_simulation_section"
    title: "Progress Simulation Section"
    from: "progress_simulation"

- bulk_create_enroll_users:
    section: "progress_simulation_section"
    prefix: "progress_simulation"
    instructors: 1
    learners: 7

- simulate_progress:
    section: "progress_simulation_section"
    users:
      - "progress_simulation_learner_1"
      - "progress_simulation_learner_2"
    seed: 42
    pct_correct: 1.0
    batch_size: 2
    max_concurrency: 1
    timeout_ms: 30000

- simulate_progress:
    section: "progress_simulation_section"
    users:
      - "progress_simulation_learner_7"
    seed: 45
    assessment_attempts:
      - pct_correct: 0.4
      - pct_correct: 0.7
      - pct_correct: 0.9
    batch_size: 1
    max_concurrency: 1
    timeout_ms: 30000

- simulate_progress:
    section: "progress_simulation_section"
    users:
      - "progress_simulation_learner_3"
      - "progress_simulation_learner_4"
    seed: 43
    pct_correct: 0.8
    batch_size: 2
    max_concurrency: 1
    timeout_ms: 30000

- simulate_progress:
    section: "progress_simulation_section"
    users:
      - "progress_simulation_learner_5"
      - "progress_simulation_learner_6"
    seed: 44
    pct_correct: 0.5
    batch_size: 2
    max_concurrency: 1
    timeout_ms: 30000

- assert:
    progress:
      section: "progress_simulation_section"
      student: "progress_simulation_learner_1"
      page: "Practice Introduction"
      progress: 1.0

- assert:
    progress:
      section: "progress_simulation_section"
      student: "progress_simulation_learner_1"
      page: "Native Activity Practice"
      progress: 0.0

- assert:
    progress:
      section: "progress_simulation_section"
      student: "progress_simulation_learner_1"
      page: "Native Activity Assessment"
      progress: 1.0

- assert:
    progress:
      section: "progress_simulation_section"
      student: "progress_simulation_learner_2"
      page: "Practice Introduction"
      progress: 1.0

- assert:
    progress:
      section: "progress_simulation_section"
      student: "progress_simulation_learner_2"
      page: "Native Activity Practice"
      progress: 0.0

- assert:
    progress:
      section: "progress_simulation_section"
      student: "progress_simulation_learner_2"
      page: "Native Activity Assessment"
      progress: 1.0
