work_item: data_model
requirements:
- id: FR-001
  title: Persist semantic learning-model selection
  status: verified
  description: Add explicit non-null learning-model selection to Projects and Sections
    using semantic naive and LKT-AOA enum values independent of analytics versioning.
- id: FR-002
  title: Propagate and pin model selection
  status: verified
  description: Copy model selection through every supported Project, template, Section,
    cloning, and duplication path while keeping created Sections pinned to their copied
    value.
- id: FR-003
  title: Preserve a behavior-neutral staged rollout
  status: verified
  description: Keep existing and newly created Projects and Sections naive in this
    work item and defer automatic LKT-AOA selection for new Projects to a later rollout.
- id: FR-004
  title: Preserve model selection through project archives
  status: verified
  description: Export and import Project and template model selections with explicit
    validation, legacy fallback behavior, and faithful round-trip semantics.
- id: FR-005
  title: Store versioned parameters on Revisions
  status: verified
  description: Add dedicated self-describing JSONB learning-model parameter storage
    to exact resource Revisions without reusing the generic parameters field.
- id: FR-006
  title: Represent and validate LO and activity-part parameters
  status: verified
  description: Support one LO beta coefficient and one difficulty coefficient per
    activity part with strict validation and distinct missing-versus-zero semantics.
- id: FR-007
  title: Provide a typed extensible parameter boundary
  status: verified
  description: Load and dump parameter envelopes through explicit versioned Elixir
    structs and one custom Ecto type that rejects unsupported or mismatched payloads.
- id: FR-008
  title: Preserve parameters through content lifecycle workflows
  status: verified
  description: Carry parameter payloads through Revision creation, duplication, cloning,
    publication, and applicable import/export paths while delivery resolves Section-pinned
    Revisions.
- id: FR-009
  title: Configure global LKT-AOA coefficients at application startup
  status: verified
  description: Provide centralized validated defaults and environment overrides for
    gamma, rho, recency decay, and confidence saturation, with changes taking effect
    only after restart.
