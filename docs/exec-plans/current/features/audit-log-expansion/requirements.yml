    title: After cutover, individual, bulk, and reset settings operations write only the central history,
      atomically with their local mutations; functional effective-settings behavior is preserved.
    status: verified_plan
    verification_method: automated
    proofs: []
  - id: AC-086
    title: Legacy history APIs, application/test consumers, and storage are retired after migration verification
      and any known external dependencies are addressed. Rollback/retirement is documented; no permanent
      double-write or parallel history remains.
    status: verified_plan
    verification_method: hybrid
    proofs: []
- id: FR-034
  title: Make new and historical events understandable and searchable in the existing Audit Log
  status: verified_plan
  acceptance_criteria:
  - id: AC-087
    title: The administrator Audit Log displays every cataloged event family with readable action, actor,
      affected subject/entity, relevant scope, time, safe changes, and outcome where applicable; it also
      renders incomplete historical and explicit system events without errors.
    status: verified_plan
    verification_method: automated
    proofs: []
  - id: AC-088
    title: An administrator can find events by retained actor or affected-entity identity, including deleted
      targets; existing actor name/email and project/section slug searches remain useful. Safe snapshots
      participate where live records are unavailable.
    status: verified_plan
    verification_method: automated
    proofs: []
  - id: AC-089
    title: Action, time-range, and applicable project/section constraints narrow results correctly, including
      at partition boundaries; combining filters, clearing filters, sorting, and pagination preserves
      stable results.
    status: verified_plan
    verification_method: automated
    proofs: []
  - id: AC-090
    title: Details, empty results, unknown historical fields, and unavailable target links are understandable
      and keyboard accessible using established labels/focus patterns. The UI exposes neither secrets
      nor schema-version implementation details as primary content.
    status: verified_plan
    verification_method: hybrid
    proofs: []
- id: FR-035
  title: Preserve authorization and scope isolation
  status: verified_plan
  acceptance_criteria:
  - id: AC-091
    title: Only principals permitted by the existing administrator Audit Log policy can access its list,
      details, and search results; unauthorized direct requests and manipulated identifiers/filters do
      not disclose events.
    status: verified_plan
    verification_method: automated
    proofs: []
  - id: AC-092
    title: Migrated operations retain their existing role, institution, project, and section authorization
      checks. Supplying an audit actor or using API/MCP/Scenario/job entry points does not grant additional
      operation permissions.
    status: verified_plan
    verification_method: automated
    proofs: []
- id: FR-036
  title: Separate mutation logic from shared audited orchestration and enforce dependencies
  status: verified_plan
  acceptance_criteria:
  - id: AC-093
    title: Migrated operations expose a shared domain coordinator that invokes the raw mutation and event
      creation, independently of UI transport. Raw mutation code does not insert audit records; read APIs
      remain usable without mutation privileges.
    status: verified_plan
    verification_method: hybrid
    proofs: []
  - id: AC-094
    title: The Boundary pilot demonstrates that representative consumers can call allowed read/coordinator
      APIs, cannot directly reference protected mutation modules, and cause CI to fail on a deliberate
      forbidden reference. The verified compiler environments and topology are documented.
    status: verified_plan
    verification_method: hybrid
    proofs: []
  - id: AC-095
    title: Each migrated group removes or restricts its unaudited public shortcuts and inventories direct
