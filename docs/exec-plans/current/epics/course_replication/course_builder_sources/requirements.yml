work_item: course_builder_sources
requirements:
- title: Add source filter tabs (All Sources, Templates, My Course Sections) with
    sort-order preservation
  description: The Select Source Materials step gains All Sources, Templates, and
    My Course Sections filter tabs. Changing tabs must not reset the user's chosen
    sort order, and search/sort stay scoped to the active tab's source set.
  status: proposed
  id: FR-001
- title: Scope My Course Sections listing to the current instructor's eligible sections
    using the MER-5841 authorization contract
  description: The My Course Sections tab lists active enrollable sections where the
    current instructor holds an instructor/content-developer role (any active enrollable
    section for admins), resolved server-side by reusing MER-5841's authorization
    rule rather than a new or client-side check.
  status: proposed
  id: FR-002
- title: Redesign source cards with improved density and type tags
  description: 'Source cards get tighter density/spacing and scannable metadata, plus
    a type tag: ''Template'' for existing project/product sources, ''My Section''
    for My Course Sections rows, and no tag when a source is neither.'
  status: proposed
  id: FR-003
- title: Add the new-feature explanatory banner to the Select Source Materials step
  description: A new banner explaining the My Course Sections / copy feature renders
    between the filter/search bar and the pagination + result-count row.
  status: proposed
  id: FR-004
- title: Add keyboard-accessible hover tooltips to the Templates and My Course Sections
    filter buttons
  description: Both filter buttons get a hover tooltip with agreed copy, reusing the
    existing GlobalTooltip hook, with a keyboard/focus-triggered equivalent.
  status: proposed
  id: FR-005
- title: Add a purely visual hover state to My Course Sections cards without enabling
    selection
  description: My Course Sections cards get the designed hover treatment (darkened
    overlay plus 'SELECT TO COPY COURSE SECTION' label) as a visual-only affordance;
    activating the card must remain a no-op in this ticket, since the real copy action
    ships in MER-5832.
  status: proposed
  id: FR-006
- title: Update the wizard's left-panel step copy and footer styling for step 1 only,
    scoped away from the student-onboarding wizard
  description: The section-creation wizard's left-panel 3-step titles/descriptions
    and footer (Cancel/Next Step) button styling are updated for step 1 of 3 only.
    OliWeb.Common.Stepper is shared with the student-onboarding wizard, so the change
    must be scoped to the course_creation_stepper id and must not alter the student-onboarding
    wizard's appearance.
  status: proposed
  id: FR-007
- title: Keep the updated Select Source Materials UI fully keyboard-operable with
    accessible dynamic announcements
  description: Every filter, sort control, card, and tooltip trigger introduced or
    changed by this ticket is keyboard-operable with visible focus states, and dynamic
    result-list updates are announced to assistive technology.
  status: proposed
  id: FR-008
