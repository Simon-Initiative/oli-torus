version: 1
feature: content_filter
generated_from: docs/exec-plans/current/epics/objectives-editor/content_filter/prd.md
work_item: content_filter
requirements:
- id: FR-001
  title: Provide the Course content toolbar filter
  description: Add the exact Course content dropdown to the Learning Objectives authoring
    toolbar in the approved Figma grouping and connect it to the current workspace
    editor.
  status: verified
- id: FR-002
  title: Render and operate a curriculum checklist
  description: Display a scrollable Unit, Module, Section, and Page hierarchy that
    supports multiple selections, OR semantics, descendant inclusion for selected
    parents, and child selection without ancestor selection.
  status: verified
- id: FR-003
  title: Filter objective coverage by course content
  description: Include objectives attached directly to selected pages or through embedded
    activities on selected pages, show matching parent Learning Objectives, and show
    only matching Sub-Objectives.
  status: verified
- id: FR-004
  title: Preserve composed filter state in query parameters
  description: Preserve search, sort, and Coverage Issues state while applying or
    clearing Course content selections, and serialize selections for sharing, refresh,
    and browser history navigation.
  status: verified
- id: FR-005
  title: Show active state and selection count
  description: Indicate when the filter is active and count the deduplicated selected
    active containers and pages, including descendants activated by selected parents.
  status: verified
- id: FR-006
  title: Provide accessible and resilient controls
  description: Make the hierarchy keyboard accessible with programmatic structure,
    ARIA checkbox and expansion state, descriptive labels, visible focus indicators,
    title truncation, and full-title tooltips while tolerating malformed optional
    data.
  status: verified
- id: FR-007
  title: Use the shared read-only coverage model
  description: Use Oli.Authoring.ObjectiveCoverage and its compact in-memory indexes
    without full content loads, repeated per-selection queries, or writes to course
    data.
  status: verified
acceptance_criteria:
