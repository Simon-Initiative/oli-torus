  status: verified
  verification_method: automated
  proofs:
  - test/oli_web/live/workspaces/course_author/objectives_live_test.exs: hierarchy rendering, OR selection, and parent/child semantics
- id: AC-003
  requirement_id: FR-003
  title: Direct page tags and embedded-activity tags within selected pages produce
