work_item: core_impl
requirements:
- title: Persist compact per-learner/per-LO operational state
  status: verified
  description: Store the complete constant-work proficiency and confidence state for
    each Section, learner, and learning objective without persisting attempt history
    in the state row.
  id: FR-001
- title: Apply the LKT-AOA proficiency transition
  status: verified
  description: Calculate pre-response probability, running all-opportunities average,
    and decayed recency state using the documented binary outcome and typed coefficients.
  id: FR-002
- title: Track confidence from distinct activity-part evidence
  status: verified
  description: Persist normalized prior-part membership and derive confidence breadth
    without incrementing repeated encounters.
  id: FR-003
- title: Process single and bulk evaluated attempts with bounded database work
  status: verified
  description: Support multi-LO parts and large graded pages or exams through one
    collection-oriented operation whose database round trips do not grow with contribution
    count.
  id: FR-004
- title: Enforce exact idempotency without updating PartAttempts
  status: verified
  description: Claim each evaluated PartAttempt once in a narrow append-only projection
    and make successful retries no-ops.
  id: FR-005
- title: Guarantee atomic and concurrency-safe state mutation
  status: verified
  description: Commit claims, evidence, and learner state together while preventing
    lost updates, double increments, and avoidable deadlocks.
  id: FR-006
- title: Integrate model application with Snapshot processing and semantic dispatch
  status: verified
  description: Run LKT-AOA only for Sections pinned to lkt_aoa while preserving naive
    behavior, summary analytics, and xAPI emission.
  id: FR-007
- title: Consume typed publication-pinned parameters and startup configuration
  status: verified
  description: Use exact activity and published LO Revisions, explicit cold-start
    coefficients, and one typed global configuration per batch.
  id: FR-008
- title: Replay each batch deterministically
  status: verified
  description: Apply contributions sequentially within each learner/LO state by evaluation
    time and immutable GUID tie-breaker without imposing cross-job chronology.
  id: FR-009
- title: Provide bounded operational observability
  status: verified
  description: Measure batch performance, claims, evidence, state impact, failures,
    and query scaling without emitting learner-level or attempt-level identifiers.
  id: FR-010
acceptance_criteria:
- requirement_id: FR-001
  title: learning_state has one unique row per section_id, user_id, and learning_objective_id
    with attempt_count, success_score, failure_score, recency_logit, aoa, unique_activity_part_count,
    confidence, and standard timestamps.
  status: verified
  verification_method: automated
  proofs:
  - priv/repo/migrations/20260824120000_create_learning_model_operational_tables.exs
  - lib/oli/learning_model/learning_state.ex
  - test/oli/learning_model/operational_storage_test.exs
  id: AC-001
- requirement_id: FR-001
