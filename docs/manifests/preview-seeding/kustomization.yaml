apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - runtime-config.yaml
  - seed-job.yaml
images:
  # The owning preview overlay must apply the same image replacement to its Deployment and this Job.
  - name: oli-torus-preview
    newName: ghcr.io/simon-initiative/oli-torus
    newTag: preview
replacements:
  - source:
      kind: ConfigMap
      name: oli-torus-preview-runtime
      fieldPath: data.PREVIEW_QA_SEED_SCENARIO
    targets:
      - select:
          kind: Job
          name: oli-torus-preview-seed
        fieldPaths:
          - spec.template.spec.containers.[name=seed].args.3
