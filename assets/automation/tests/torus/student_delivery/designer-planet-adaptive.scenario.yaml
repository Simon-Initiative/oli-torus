# Scenario: Import the BioBeyond Designer Planet export and create a learner section.
#
# Parameters:
#   RUN_ID - suffix for unique user emails.
#   PROJECT_ZIP_PATH - local path to the private BioBeyond project export zip.

- user:
    name: 'playwright_author'
    type: 'author'
    email: 'designer-planet-author${RUN_ID}@example.com'
    given_name: 'Designer'
    family_name: 'Planet Author'
    password: 'changeme123456'

- user:
    name: 'designer_planet_student'
    type: 'student'
    email: 'designer-planet-student${RUN_ID}@example.com'
    given_name: 'Designer'
    family_name: 'Planet Student'
    password: 'changeme123456'

- user:
    name: 'designer_planet_instructor'
    type: 'instructor'
    email: 'designer-planet-instructor${RUN_ID}@example.com'
    given_name: 'Designer'
    family_name: 'Planet Instructor'
    password: 'changeme123456'
    can_create_sections: true

- user:
    name: 'designer_planet_admin'
    type: 'author'
    system_role: 'system_admin'
    email: 'designer-planet-admin${RUN_ID}@example.com'
    given_name: 'Designer'
    family_name: 'Planet Admin'
    password: 'changeme123456'

- hook:
    function: 'Oli.Scenarios.Playwright.BioBeyondDesignerPlanetHooks.import_project/1'

- publish:
    to: 'biobeyond_designer_planet_project'
    description: 'Playwright Designer Planet publication'

- section:
    name: 'biobeyond_designer_planet_section'
    title: 'BioBeyond Designer Planet Playwright ${RUN_ID}'
    from: 'biobeyond_designer_planet_project'
    slug: 'biobeyond-playwright-designer-planet${RUN_ID}'
    type: 'enrollable'
    registration_open: true
    open_and_free: true
    end_date: '2027-12-31T23:59:59Z'

- enroll:
    user: 'designer_planet_student'
    section: 'biobeyond_designer_planet_section'
    role: 'student'
