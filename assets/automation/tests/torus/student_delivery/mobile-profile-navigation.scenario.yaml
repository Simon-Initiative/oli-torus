# Scenario: Seed a three-page course for the mobile profile settings and course navigation spec.
#
# Each page is taller than a phone screen: the lesson bottom bar only appears after scrolling down.
# The pages sit directly under the root so the lesson Previous/Next sequence is exactly
# first -> middle -> last, with no unit or module neighbours. The last page is an exploration,
# which makes the Explorations view available, and page collaboration enables the Notes view.
# Parameters:
#   RUN_ID - suffix to make titles and emails unique.

- project:
    name: 'mobile_profile_navigation_project'
    title: 'Mobile Profile Navigation Course ${RUN_ID}'
    root:
      children:
        - page: 'Mobile First Page'
        - page: 'Mobile Middle Page'
        - page: 'Mobile Exploration Page'

- edit_page:
    project: 'mobile_profile_navigation_project'
    page: 'Mobile First Page'
    content: |
      title: "Mobile First Page"
      graded: false
      blocks:
        - type: prose
          body_md: "First page content"
        - type: prose
          body_md: "Students read this paragraph on a phone. It is long enough to wrap over several lines, so the lesson needs scrolling.\n\nStudents read this paragraph on a phone. It is long enough to wrap over several lines, so the lesson needs scrolling.\n\nStudents read this paragraph on a phone. It is long enough to wrap over several lines, so the lesson needs scrolling.\n\nStudents read this paragraph on a phone. It is long enough to wrap over several lines, so the lesson needs scrolling.\n\nStudents read this paragraph on a phone. It is long enough to wrap over several lines, so the lesson needs scrolling.\n\nStudents read this paragraph on a phone. It is long enough to wrap over several lines, so the lesson needs scrolling."

- edit_page:
    project: 'mobile_profile_navigation_project'
    page: 'Mobile Middle Page'
    content: |
      title: "Mobile Middle Page"
      graded: false
      blocks:
        - type: prose
          body_md: "Middle page content"
        - type: prose
          body_md: "Students read this paragraph on a phone. It is long enough to wrap over several lines, so the lesson needs scrolling.\n\nStudents read this paragraph on a phone. It is long enough to wrap over several lines, so the lesson needs scrolling.\n\nStudents read this paragraph on a phone. It is long enough to wrap over several lines, so the lesson needs scrolling.\n\nStudents read this paragraph on a phone. It is long enough to wrap over several lines, so the lesson needs scrolling.\n\nStudents read this paragraph on a phone. It is long enough to wrap over several lines, so the lesson needs scrolling.\n\nStudents read this paragraph on a phone. It is long enough to wrap over several lines, so the lesson needs scrolling."

- edit_page:
    project: 'mobile_profile_navigation_project'
    page: 'Mobile Exploration Page'
    content: |
      title: "Mobile Exploration Page"
      graded: false
      blocks:
        - type: prose
          body_md: "Exploration page content"
        - type: prose
          body_md: "Students read this paragraph on a phone. It is long enough to wrap over several lines, so the lesson needs scrolling.\n\nStudents read this paragraph on a phone. It is long enough to wrap over several lines, so the lesson needs scrolling.\n\nStudents read this paragraph on a phone. It is long enough to wrap over several lines, so the lesson needs scrolling.\n\nStudents read this paragraph on a phone. It is long enough to wrap over several lines, so the lesson needs scrolling.\n\nStudents read this paragraph on a phone. It is long enough to wrap over several lines, so the lesson needs scrolling.\n\nStudents read this paragraph on a phone. It is long enough to wrap over several lines, so the lesson needs scrolling."

- manipulate:
    to: 'mobile_profile_navigation_project'
    ops:
      - revise:
          target: 'Mobile Exploration Page'
          set:
            purpose: '@atom(application)'

- publish:
    to: 'mobile_profile_navigation_project'
    description: 'Initial mobile profile navigation course'

- section:
    name: 'mobile_profile_navigation_section'
    title: 'Mobile Profile Navigation Section ${RUN_ID}'
    from: 'mobile_profile_navigation_project'

# Scenario sections skip the post-processing that derives this flag from page purposes.
- manipulate:
    to: 'mobile_profile_navigation_section'
    ops:
      - change:
          contains_explorations: true

- page_collab_config:
    section: 'mobile_profile_navigation_section'
    enabled: true

- user:
    name: 'mobile_profile_navigation_student'
    type: 'student'
    email: 'mobile-profile-navigation-student${RUN_ID}@example.com'
    given_name: 'Mobile'
    family_name: 'Student'
    password: 'changeme123456'

# Separate account for the email and password changes, so they never affect the other tests.
- user:
    name: 'mobile_profile_credentials_student'
    type: 'student'
    email: 'mobile-profile-credentials-student${RUN_ID}@example.com'
    given_name: 'Credentials'
    family_name: 'Student'
    password: 'changeme123456'

- enroll:
    user: 'mobile_profile_navigation_student'
    section: 'mobile_profile_navigation_section'
    role: 'student'

- enroll:
    user: 'mobile_profile_credentials_student'
    section: 'mobile_profile_navigation_section'
    role: 'student'

- hook:
    function: 'Oli.Scenarios.Hooks.mark_sections_visited/1'
