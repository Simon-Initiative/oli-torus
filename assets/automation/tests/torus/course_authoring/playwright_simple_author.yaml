# Seeds the Simple Author suite.
# Parameters:
#   RUN_ID - suffix that keeps emails, project, and section names unique per run.
# The Test Author/Educator/Learner display names and Automation test section title
# satisfy the guarded automation teardown contract used by the companion spec.

- user:
    name: 'simple_author_author'
    type: 'author'
    email: 'simple-author${RUN_ID}@example.com'
    given_name: 'Test'
    family_name: 'Author'
    password: 'changeme123456'

- user:
    name: 'simple_author_instructor'
    type: 'instructor'
    email: 'simple-instructor${RUN_ID}@example.com'
    given_name: 'Test'
    family_name: 'Educator'
    password: 'changeme123456'
    can_create_sections: true

- user:
    name: 'simple_author_student'
    type: 'student'
    email: 'simple-student${RUN_ID}@example.com'
    given_name: 'Test'
    family_name: 'Learner'
    password: 'changeme123456'

- project:
    name: 'Simple Author Suite${RUN_ID}'
    title: 'Simple Author Suite${RUN_ID}'
    visibility: global
    root:
      children:
        - page: 'Page 1'

- section:
    name: 'Simple Author Suite${RUN_ID}'
    title: 'Automation test section'
    from: 'Simple Author Suite${RUN_ID}'
    open_and_free: true

- enroll:
    user: 'simple_author_instructor'
    email: 'simple-instructor${RUN_ID}@example.com'
    section: 'Simple Author Suite${RUN_ID}'
    role: instructor

- enroll:
    user: 'simple_author_student'
    email: 'simple-student${RUN_ID}@example.com'
    section: 'Simple Author Suite${RUN_ID}'
    role: student
