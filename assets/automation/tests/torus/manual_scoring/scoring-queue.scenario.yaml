# Scenario: four students waiting for manual scoring on one two-part activity.
# Every student submits after the previous one, so the queue's default order (newest first) is
# Pedro, Maria, Kevin, Ana. Both parts are manually graded so the scoring page has a part to hide.

- project:
    name: 'scoring_queue_project'
    title: 'Scoring Queue ${RUN_ID}'
    root:
      children:
        - page: 'Manual Two Part'

- create_activity:
    project: 'scoring_queue_project'
    title: 'Two Part Manual'
    virtual_id: 'two_part'
    type: 'oli_multi_input'
    content_format: 'json'
    content:
      activityType: 'oli_multi_input'
      submitPerPart: false
      choices: []
      inputs:
        - id: 'in_a'
          inputType: 'text'
          partId: 'part_a'
        - id: 'in_b'
          inputType: 'text'
          partId: 'part_b'
      stem:
        id: 'two_part_stem'
        content:
          - type: 'p'
            children:
              - text: 'Explain A: '
              - type: 'input_ref'
                id: 'in_a'
                children:
                  - text: ''
              - text: ' and B: '
              - type: 'input_ref'
                id: 'in_b'
                children:
                  - text: ''
      authoring:
        targeted: []
        transformations: []
        previewText: ''
        parts:
          - id: 'part_a'
            scoringStrategy: 'best'
            gradingApproach: 'manual'
            outOf: 4
            responses:
              - id: 'part_a_any'
                rule: 'input like {.*}'
                score: 0
                feedback:
                  id: 'part_a_fb'
                  content: []
            hints: []
          - id: 'part_b'
            scoringStrategy: 'best'
            gradingApproach: 'manual'
            outOf: 4
            responses:
              - id: 'part_b_any'
                rule: 'input like {.*}'
                score: 0
                feedback:
                  id: 'part_b_fb'
                  content: []
            hints: []

- edit_page:
    project: 'scoring_queue_project'
    page: 'Manual Two Part'
    content: |
      title: "Manual Two Part"
      graded: true
      blocks:
        - type: activity_reference
          virtual_id: "two_part"

- publish:
    to: 'scoring_queue_project'
    description: 'Scoring queue publication'

- section:
    name: 'scoring_queue_section'
    title: 'Scoring Queue ${RUN_ID}'
    from: 'scoring_queue_project'
    type: 'enrollable'
    registration_open: true

- user:
    name: 'scoring_queue_instructor'
    type: 'instructor'
    email: 'scoring-queue-instructor${RUN_ID}@example.com'
    given_name: 'Queue'
    family_name: 'Instructor'
    password: 'changeme123456'

- enroll:
    user: 'scoring_queue_instructor'
    section: 'scoring_queue_section'
    role: 'instructor'

- user:
    name: 'ana'
    type: 'student'
    email: 'scoring-queue-ana${RUN_ID}@example.com'
    given_name: 'Ana'
    family_name: 'Alvarez'
    password: 'changeme123456'

- enroll:
    user: 'ana'
    section: 'scoring_queue_section'
    role: 'student'

- visit_page:
    student: 'ana'
    section: 'scoring_queue_section'
    page: 'Manual Two Part'

- answer_question:
